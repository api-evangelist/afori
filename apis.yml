aid: afori
name: Afori
description: >-
  Afori is a Barcelona- and Germany-based insurtech building an AI software platform designed
  specifically for insurance brokers (Versicherungsmakler). Its first product is an AI Sidebar that
  lives inside Microsoft Outlook and broker management systems (Maklerverwaltungsprogramme), turning
  unstructured emails and documents into structured, review-ready cases with tasks and reminders,
  context-aware email drafts, and prefilled claim notifications. Specialized AI agents (KI-Helfer)
  automate insurance-specific back-office work while keeping every action documented and auditable.
  The platform is EU-hosted, GDPR (DSGVO) compliant, ISO 27001:2022 certified, and built within the
  European regulatory framework (IDD, EU AI Act). Founded in 2025 by former wefox leaders Fabian
  Wesemann (CEO) and Sergi Banos (CTO), Afori raised a EUR 4M round led by General Catalyst. This
  API Evangelist profile was created as a portfolio-lead stub and enriched from Afori's public web
  surface; the company currently publishes no developer API, SDKs, or OpenAPI.
